# ==================================
# WIWIGA - Docker Compose Configuration
# ==================================
# Description: Environment complet avec PostgreSQL, Redis et Backend
# Version: 1.0 - 2026-06-24

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: wiwiga_postgres
    environment:
      POSTGRES_USER: wiwiga_user
      POSTGRES_PASSWORD: wiwiga_password
      POSTGRES_DB: wiwiga_dev
    ports:
      - "8001:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiwiga_user -d wiwiga_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: wiwiga_redis
    ports:
      - "8002:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Elixir/Phoenix Backend (avec hot reload)
  backend:
    build:
      context: ./game_hub
      dockerfile: ../Dockerfile.backend
    container_name: wiwiga_backend
    restart: unless-stopped
    stop_grace_period: 25s
    environment:
      MIX_ENV: dev
      DATABASE_URL: postgresql://wiwiga_user:wiwiga_password@postgres:5432/wiwiga_dev
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY_BASE: dev_secret_key_base_change_in_production
      PORT: 4001
      ALLOWED_ORIGINS: "*"
      ENABLE_RATE_LIMITING: "false"
      # Notifications : aucune credential provider ici — configuration
      # exclusive via l'admin (/admin/notification-providers), persistée
      # en base (secrets chiffrés). Voir docs/FCM_SETUP.md.
    ports:
      - "8000:4001"
    volumes:
      # Montage du code source pour détection de changements
      - ./game_hub:/app
      # Volumes séparés pour préserver deps et _build
      - deps_data:/app/deps
      - build_data:/app/_build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      bash -c "
        mix deps.get &&
        mix ecto.create 2>/dev/null;
        mix ecto.migrate &&
        mix run priv/repo/seeds.exs 2>/dev/null;
        echo '[WIWIGA] Phoenix server avec hot reload activé...' &&
        mix phx.server
      "

  # Flutter Web Frontend (avec rebuild automatique)
  frontend:
    build:
      context: ./wiwiga_app
      dockerfile: Dockerfile.dev
    container_name: wiwiga_frontend
    restart: unless-stopped
    ports:
      - "8003:80"
    volumes:
      # Montage du code source pour détection de changements
      - ./wiwiga_app/lib:/app/lib
      - ./wiwiga_app/pubspec.yaml:/app/pubspec.yaml
      - ./wiwiga_app/assets:/app/assets
      # Préserver .dart_tool (cache Flutter)
      - flutter_cache:/app/.dart_tool
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:4001
      # Config Firebase Web pour l'auto-rebuild dev (auto-rebuild.sh) :
      # clés clientes PUBLIQUES (bundle JS), jamais de secret ici.
      - FLUTTER_WEB_CANVASKIT_URL=canvaskit/
      - FIREBASE_API_KEY=AIzaSyCxPkfsemAaXeyHQ4FlclNn7OHfdVoCyRk
      - FIREBASE_AUTH_DOMAIN=wiwiga-d9a7e.firebaseapp.com
      - FIREBASE_PROJECT_ID=wiwiga-d9a7e
      - FIREBASE_SENDER_ID=660834792043
      - FIREBASE_APP_ID=1:660834792043:web:c2737e7e778f743333f72e
      - FCM_VAPID_KEY=BEgSTIDMIisP3WrsNPY6GxCTiag_e5qcEZyZ3k6-j5ipo35TUUmjoBs7E8Xgh2T7V9hPLRRgDsLkSdVFTH3dmaE

volumes:
  postgres_data:
  redis_data:
  deps_data:
  build_data:
  flutter_cache:
