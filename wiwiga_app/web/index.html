<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="WIWIGA - Plateforme de jeux sécurisée">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="WIWIGA">
  <meta name="theme-color" content="#2DD4BF">
  <meta name="msapplication-TileColor" content="#0F172A">
  <!-- WIWIGA Q — favicon system (avec/sans cadre, dark/light) -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <title>WIWIGA - Jeux en ligne</title>
  <!-- Noto Sans: police de secours Unicode large (emoji, CJK, arabe, etc.) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0F172A;
      overflow: hidden;
    }

    /* 
     * Fallback fonts : remplace Roboto (Google CDN) par les fonts système.
     * Évite les erreurs "Failed to load font Roboto" en environnement offline.
     * Les fonts Inter/Orbitron sont chargées par Flutter depuis les assets locaux.
     */
    @font-face {
      font-family: 'Roboto';
      font-style: normal;
      font-weight: 400;
      src: local('Inter'), local('Segoe UI'), local('Helvetica Neue'), local('Arial');
    }
    @font-face {
      font-family: 'Roboto';
      font-style: normal;
      font-weight: 500;
      src: local('Inter Medium'), local('Segoe UI Semibold'), local('Helvetica Neue Medium'), local('Arial');
    }
    @font-face {
      font-family: 'Roboto';
      font-style: normal;
      font-weight: 700;
      src: local('Inter Bold'), local('Segoe UI Bold'), local('Helvetica Neue Bold'), local('Arial Bold');
    }

    /* Loading indicator pendant le bootstrap Flutter — Q CADRE GRAS */
    #loading-indicator {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #2DD4BF;
      font-family: 'Orbitron', 'Segoe UI', sans-serif;
      font-size: 18px;
      letter-spacing: 0.18em;
      text-align: center;
    }
    #loading-indicator .q-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 14px;
      display: block;
    }
    #loading-indicator .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid rgba(45, 212, 191, 0.18);
      border-top-color: #2DD4BF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <!-- Q sans cadre — W plein fin (contexte favicon/header 32) — stroke 6.2% -->
    <svg class="q-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M20 36 L32 68 L44.5 44 L55.5 44 L68 68 L80 36" stroke="#2DD4BF" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="spinner"></div>
    WIWIGA
  </div>
  <script>
    // Supprimer le loading indicator quand Flutter est prêt
    window.addEventListener('flutter-first-frame', function() {
      var el = document.getElementById('loading-indicator');
      if (el) el.style.display = 'none';
    });

    // Flutter 3.44+ : le nouveau loader ignore window.flutterConfiguration.
    // On injecte canvasKitBaseUrl directement dans _flutter.loader.load()
    // pour charger CanvasKit depuis nginx (local) au lieu du CDN Google.
    (function() {
      var origLoad = null;
      var checkInterval = setInterval(function() {
        if (window._flutter && window._flutter.loader && window._flutter.loader.load) {
          clearInterval(checkInterval);
          origLoad = window._flutter.loader.load.bind(window._flutter.loader);
          window._flutter.loader.load = function(opts) {
            opts = opts || {};
            opts.config = opts.config || {};
            opts.config.canvasKitBaseUrl = '/canvaskit/';
            return origLoad(opts);
          };
        }
      }, 1);
      // Safety: stop checking after 10s
      setTimeout(function() { clearInterval(checkInterval); }, 10000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
