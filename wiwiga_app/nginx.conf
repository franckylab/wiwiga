server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript application/wasm;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # NE JAMAIS cacher les fichiers bootstrap (critique pour les rebuilds)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location = /flutter.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Cache statique pour assets avec hash (content-hashed)
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache statique pour canvaskit
    location ~* ^/canvaskit/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Favicon & manifest — correct MIME + cache (sans écraser mime.types global)
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
    }
    location ~* manifest\.json$ {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
    }

    # --- API & WebSocket MUST be before SPA fallback ---
    # Proxy API requests to backend (LAN-IP compatible)
    # Note: CORS géré par backend (CORSPlug) qui renvoie l'origin exacte
    #       => ne pas ajouter Access-Control-* ici pour éviter doublons
    location /api/ {
        proxy_pass http://backend:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Device-ID $http_x_device_id;
        proxy_read_timeout 86400;
        proxy_connect_timeout 10s;
        proxy_send_timeout 86400;
        # Préserver les headers CORS du backend même avec add_header server-level
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Methods;
        proxy_pass_header Access-Control-Allow-Headers;
        proxy_pass_header Access-Control-Allow-Credentials;
        proxy_pass_header Access-Control-Max-Age;
        proxy_pass_header Vary;
        # OPTIONS preflight: laisser le backend répondre 204, mais gérer timeout
        proxy_intercept_errors off;
        client_max_body_size 10M;
    }

    # WebSocket proxy (Phoenix Channels)
    location /socket/ {
        proxy_pass http://backend:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 86400;
        proxy_connect_timeout 10s;
        proxy_send_timeout 86400;
        proxy_buffering off;
        proxy_cache off;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Flutter Web routing (SPA) - FALLBACK, doit être en dernier
    location / {
        try_files $uri $uri/ /index.html;
    }
}
