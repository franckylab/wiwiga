openapi: 3.0.3
info:
  title: WIWIGA API
  description: |
    API pour la plateforme de jeux WIWIGA avec paiement Mobile Money.
    
    ## Authentification
    La plupart des endpoints nécessitent un token JWT obtenu via OTP.
    
    ## Flow d'authentification
    1. `POST /api/auth/send-otp` - Envoyer code OTP
    2. `POST /api/auth/verify-otp` - Vérifier OTP et obtenir JWT
    3. Utiliser JWT dans header `Authorization: Bearer <token>`
    
    ## Paiement
    Intégration avec Campay pour Mobile Money (Afrique).
    
  version: 1.0.0
  contact:
    name: WIWIGA Team
    email: contact@wiwiga.com

servers:
  - url: http://localhost:4000
    description: Development
  - url: https://api.wiwiga.com
    description: Production

tags:
  - name: Health
    description: Monitoring et santé du système
  - name: Authentication
    description: Authentification OTP et JWT
  - name: Wallet
    description: Gestion du compte utilisateur (dépôt, retrait, historique monétaire)
  - name: Tokens
    description: Jetons virtuels (achat, cadeau ami, promos) — échange et transfert supprimés
  - name: Games
    description: Jeux et matchmaking
  - name: Webhooks
    description: Webhooks de paiement

paths:
  # ==================================
  # HEALTH CHECKS
  # ==================================
  /api/health:
    get:
      tags:
        - Health
      summary: Santé globale du système
      description: Retourne l'état de tous les services (DB, Redis)
      operationId: getHealth
      responses:
        '200':
          description: Système healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Système dégradé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDegradedResponse'

  /api/health/ready:
    get:
      tags:
        - Health
      summary: Prêt à recevoir du trafic
      description: Vérifie si l'application est prête
      operationId: getHealthReady
      responses:
        '200':
          description: Prêt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadyResponse'
        '503':
          description: Pas prêt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthNotReadyResponse'

  /api/health/db:
    get:
      tags:
        - Health
      summary: Santé base de données
      description: Métriques PostgreSQL détaillées
      operationId: getHealthDB
      responses:
        '200':
          description: DB healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDBResponse'

  /api/health/redis:
    get:
      tags:
        - Health
      summary: Santé Redis
      description: Métriques Redis détaillées
      operationId: getHealthRedis
      responses:
        '200':
          description: Redis healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRedisResponse'

  # ==================================
  # AUTHENTICATION
  # ==================================
  /api/auth/send-otp:
    post:
      tags:
        - Authentication
      summary: Envoyer code OTP
      description: Génère et envoie un code OTP à 6 chiffres par SMS
      operationId: sendOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                  example: "+237612345678"
                  description: Numéro de téléphone au format international
      responses:
        '200':
          description: OTP envoyé
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Numéro invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/verify-otp:
    post:
      tags:
        - Authentication
      summary: Vérifier OTP et obtenir JWT
      description: Vérifie le code OTP et retourne un token JWT
      operationId: verifyOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - otp
              properties:
                phone:
                  type: string
                  example: "+237612345678"
                otp:
                  type: string
                  example: "123456"
                  description: Code OTP à 6 chiffres
      responses:
        '200':
          description: Authentification réussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        description: JWT token
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          description: OTP invalide ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh JWT token
      description: Génère un nouveau JWT token
      operationId: refreshToken
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Nouveau token généré
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      token:
                        type: string
        '401':
          description: Token invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================================
  # WALLET
  # ==================================
  /api/wallet/balance:
    get:
      tags:
        - Wallet
      summary: Solde utilisateur
      description: Retourne le solde monétaire actuel du compte
      operationId: getBalance
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Balance récupéré
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      balance:
                        type: integer
                        description: Balance en centimes
                        example: 150000
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/wallet/deposit:
    post:
      tags:
        - Wallet
      summary: Effectuer un dépôt
      description: Dépose des fonds dans le compte (utilise idempotence)
      operationId: deposit
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - idempotency_key
              properties:
                amount:
                  type: integer
                  description: Montant en centimes (minimum 100)
                  example: 50000
                idempotency_key:
                  type: string
                  description: Clé unique pour éviter les doublons
                  example: "deposit_123456"
      responses:
        '201':
          description: Dépôt réussi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      new_balance:
                        type: integer
                      transaction:
                        $ref: '#/components/schemas/Transaction'
        '400':
          description: Montant invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Transaction déjà effectuée (idempotence)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/wallet/withdraw:
    post:
      tags:
        - Wallet
      summary: Effectuer un retrait
      description: Retire des fonds du compte
      operationId: withdraw
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - idempotency_key
              properties:
                amount:
                  type: integer
                  description: Montant en centimes (minimum 100)
                  example: 20000
                idempotency_key:
                  type: string
                  example: "withdraw_789012"
      responses:
        '201':
          description: Retrait réussi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      new_balance:
                        type: integer
                      transaction:
                        $ref: '#/components/schemas/Transaction'
        '400':
          description: Solde insuffisant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/wallet/transactions:
    get:
      tags:
        - Wallet
      summary: Historique des transactions
      description: Retourne les transactions paginées
      operationId: getTransactions
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Numéro de page
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Nombre de transactions par page
      responses:
        '200':
          description: Liste des transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  # ==================================
  # TOKENS (Jetons virtuels)
  # ==================================
  /api/tokens/balance:
    get:
      tags:
        - Tokens
      summary: Solde jetons
      description: Retourne le solde en jetons et la valeur monétaire equivalente
      operationId: getTokenBalance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Solde jetons
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      token_balance:
                        type: integer
                        example: 5000
                      monetary_value_centimes:
                        type: integer
                        example: 50000
                      exchange_rate:
                        type: number
                        format: float
                        example: 10.0

  /api/tokens/summary:
    get:
      tags:
        - Tokens
      summary: Résumé complet jetons
      description: Retourne solde, valeur monétaire, limites échange, et options
      operationId: getTokenSummary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Résumé complet
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TokenSummary'

  /api/tokens/purchase:
    post:
      tags:
        - Tokens
      summary: Achat de jetons
      description: Convertit un montant monétaire en jetons (après paiement Mobile Money)
      operationId: purchaseTokens
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, idempotency_key]
              properties:
                amount:
                  type: integer
                  description: Montant en centimes
                  example: 5000
                idempotency_key:
                  type: string
      responses:
        '201':
          description: Achat réussi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      tokens_credited:
                        type: integer
                      monetary_value:
                        type: integer
                      exchange_rate:
                        type: number

  /api/tokens/gift:
    post:
      tags:
        - Tokens
      summary: Envoi cadeau (amis uniquement)
      description: Envoie des jetons en cadeau à un ami — vérifie Friendship accepted + limite journalière + cadeaux activés
      operationId: sendGift
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient_id, token_amount, idempotency_key]
              properties:
                recipient_id:
                  type: integer
                token_amount:
                  type: integer
                message:
                  type: string
                  example: Joyeux anniversaire!
                idempotency_key:
                  type: string
      responses:
        '200':
          description: Cadeau envoyé

  /api/tokens/transactions:
    get:
      tags:
        - Tokens
      summary: Historique transactions jetons
      description: Historique paginé des transactions de jetons
      operationId: getTokenTransactions
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Liste des transactions jetons

  /api/tokens/promos:
    get:
      tags:
        - Tokens
      summary: Promos disponibles
      description: Liste les promotions de jetons actuellement disponibles
      operationId: getAvailablePromos
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des promos actives

  /api/tokens/promos/{id}/redeem:
    post:
      tags:
        - Tokens
      summary: Réclamer une promo
      description: Réclame une promotion de jetons
      operationId: redeemPromo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key]
              properties:
                idempotency_key:
                  type: string
      responses:
        '201':
          description: Promo réclamée
        '404':
          description: Promo non trouvée
        '409':
          description: Promo déjà réclamée

  # ==================================
  # GAMES
  # ==================================
  /api/games:
    get:
      tags:
        - Games
      summary: Liste des jeux disponibles
      description: Retourne tous les jeux actifs
      operationId: listGames
      responses:
        '200':
          description: Liste des jeux
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Game'

  /api/games/{game_id}:
    get:
      tags:
        - Games
      summary: Détails d'un jeu
      description: Retourne les détails et configuration d'un jeu
      operationId: getGame
      parameters:
        - name: game_id
          in: path
          required: true
          schema:
            type: string
          example: "dice"
      responses:
        '200':
          description: Détails du jeu
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/GameDetail'
        '404':
          description: Jeu non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/games/{game_id}/join:
    post:
      tags:
        - Games
      summary: Rejoindre une partie
      description: Rejoint la file d'attente de matchmaking
      operationId: joinGame
      security:
        - BearerAuth: []
      parameters:
        - name: game_id
          in: path
          required: true
          schema:
            type: string
          example: "dice"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bet_amount
              properties:
                bet_amount:
                  type: integer
                  description: Montant de la mise en jetons (1 jeton = 1 FCFA)
                  example: 500
      responses:
        '200':
          description: Partie trouvée
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [matched]
                      game_id:
                        type: string
        '202':
          description: En file d'attente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [waiting]
        '400':
          description: Mise invalide ou solde insuffisant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/games/{game_id}/state:
    get:
      tags:
        - Games
      summary: État d'une partie
      description: Retourne l'état actuel d'une partie
      operationId: getGameState
      security:
        - BearerAuth: []
      parameters:
        - name: game_id
          in: path
          required: true
          schema:
            type: string
          example: "dice_123456_7890123456"
      responses:
        '200':
          description: État de la partie
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/GameState'
        '404':
          description: Partie non trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================================
  # WEBHOOKS
  # ==================================
  /api/webhooks/campay:
    post:
      tags:
        - Webhooks
      summary: Webhook Campay
      description: |
        Reçoit les notifications de paiement de Campay.
        
        **Sécurité**: Vérification signature HMAC SHA256
      operationId: campayWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - transaction_id
                - amount
                - phone
                - status
                - idempotency_key
                - signature
              properties:
                transaction_id:
                  type: string
                  example: "TX123456"
                amount:
                  type: integer
                  example: 50000
                phone:
                  type: string
                  example: "+237612345678"
                status:
                  type: string
                  enum: [SUCCESS, FAILED]
                idempotency_key:
                  type: string
                  example: "unique_key_123"
                signature:
                  type: string
                  description: HMAC SHA256 signature
      responses:
        '200':
          description: Webhook traité
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success, acknowledged]
        '400':
          description: Paramètres invalides
        '401':
          description: Signature invalide
        '404':
          description: Utilisateur non trouvé

  /api/notifications:
    get:
      tags:
        - Notifications
      summary: Inbox joueur paginée
      operationId: listNotifications
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: is_read
          schema:
            type: string
            enum: [true, false]
        - in: query
          name: category
          schema:
            type: string
            enum: [security, transactional, social, game, marketing]
      responses:
        '200':
          description: Inbox paginée
        '401':
          description: Non authentifié

  /api/notifications/unread-count:
    get:
      tags:
        - Notifications
      summary: Compteur de non-lues
      operationId: unreadCount
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Compteur

  /api/notifications/{id}/read:
    put:
      tags:
        - Notifications
      summary: Marquer comme lue
      operationId: markNotificationRead
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Notification lue
        '404':
          description: Notification non trouvée

  /api/notifications/{id}:
    delete:
      tags:
        - Notifications
      summary: Supprime une notification de l'inbox (propriété vérifiée)
      operationId: deleteNotification
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Notification supprimée
        '404':
          description: Notification non trouvée

  /api/notifications/read-all:
    put:
      tags:
        - Notifications
      summary: Tout marquer comme lu
      operationId: markAllNotificationsRead
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Inbox marquée comme lue

  /api/notifications/preferences:
    get:
      tags:
        - Notifications
      summary: Liste des préférences
      operationId: listNotificationPreferences
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Préférences
    put:
      tags:
        - Notifications
      summary: Active ou désactive un canal (security forcée à true)
      operationId: upsertNotificationPreference
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - category
                - channel
                - enabled
              properties:
                category:
                  type: string
                  enum: [security, transactional, social, game, marketing]
                channel:
                  type: string
                  enum: [in_app, push, sms, email]
                enabled:
                  type: boolean
      responses:
        '200':
          description: Préférence enregistrée

  /api/notifications/device-token:
    post:
      tags:
        - Notifications
      summary: Enregistre un token push (FCM)
      operationId: registerDeviceToken
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - platform
                - token
              properties:
                platform:
                  type: string
                  enum: [android, ios, web]
                token:
                  type: string
                app_version:
                  type: string
      responses:
        '201':
          description: Token enregistré
    delete:
      tags:
        - Notifications
      summary: Supprime un token push
      operationId: unregisterDeviceToken
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Token supprimé

  /api/admin/notification-providers:
    get:
      tags:
        - Admin Notifications
      summary: Liste les providers multi-canaux
      operationId: listNotificationProviders
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Providers
    post:
      tags:
        - Admin Notifications
      summary: Crée un provider
      operationId: createNotificationProvider
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - channel
                - name
                - display_name
              properties:
                channel:
                  type: string
                  enum: [in_app, push, sms, email]
                name:
                  type: string
                  example: "orange_cm"
                display_name:
                  type: string
                is_active:
                  type: boolean
                priority:
                  type: integer
                config:
                  type: object
      responses:
        '201':
          description: Provider créé

  /api/admin/notification-providers/{id}:
    put:
      tags:
        - Admin Notifications
      summary: Met à jour un provider
      operationId: updateNotificationProvider
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Provider mis à jour
    delete:
      tags:
        - Admin Notifications
      summary: Supprime un provider (logs conservés)
      operationId: deleteNotificationProvider
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Provider supprimé

  /api/admin/notification-providers/{id}/test:
    post:
      tags:
        - Admin Notifications
      summary: Teste la connexion d'un provider
      operationId: testNotificationProvider
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient:
                  type: string
                  example: "+2376XXXXXXXX"
      responses:
        '200':
          description: Test effectué

  /api/admin/notification-providers/{id}/health:
    post:
      tags:
        - Admin Notifications
      summary: Santé sans envoi (credentials, connectivité)
      operationId: checkNotificationProviderHealth
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Statut healthy/down/unchecked + détail

  /api/admin/notification-providers/{id}/config:
    get:
      tags:
        - Admin Notifications
      summary: Config assainie (secrets masqués)
      operationId: getNotificationProviderConfig
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Champs de config (valeurs sensibles masquées)
    put:
      tags:
        - Admin Notifications
      summary: Fusionne une config (secrets vides = conserver)
      operationId: updateNotificationProviderConfig
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  type: object
                  example: {"sender_id": "WIWIGA"}
      responses:
        '200':
          description: Configuration enregistrée

  /api/admin/notification-templates:
    get:
      tags:
        - Admin Notifications
      summary: Liste les templates
      operationId: listNotificationTemplates
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Templates
    post:
      tags:
        - Admin Notifications
      summary: Crée un template
      operationId: createNotificationTemplate
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - key
                - channel
                - body_tpl
              properties:
                key:
                  type: string
                  example: "wallet_credit"
                channel:
                  type: string
                  enum: [in_app, push, sms, email]
                locale:
                  type: string
                  default: fr
                version:
                  type: integer
                  default: 1
                subject:
                  type: string
                body_tpl:
                  type: string
                  example: "+{{montant}} jetons : {{motif}}"
                category:
                  type: string
                is_active:
                  type: boolean
      responses:
        '201':
          description: Template créé

  /api/admin/notification-templates/{id}:
    put:
      tags:
        - Admin Notifications
      summary: Met à jour un template
      operationId: updateNotificationTemplate
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Template mis à jour
    delete:
      tags:
        - Admin Notifications
      summary: Supprime un template (envois conservés)
      operationId: deleteNotificationTemplate
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Template supprimé

  /api/admin/notification-templates/{id}/preview:
    post:
      tags:
        - Admin Notifications
      summary: Prévisualise le rendu d'un template
      operationId: previewNotificationTemplate
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                variables:
                  type: object
      responses:
        '200':
          description: Rendu du template (+ segments si SMS)

  /api/admin/notification-templates/preview-body:
    post:
      tags:
        - Admin Notifications
      summary: Prévisualise un corps non sauvegardé (édition)
      operationId: previewNotificationBody
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                body_tpl:
                  type: string
                variables:
                  type: object
      responses:
        '200':
          description: Rendu (+ segments si SMS)

  /api/admin/notification-templates/variables/{key}:
    get:
      tags:
        - Admin Notifications
      summary: Variables requises d'une clé (union tous canaux)
      operationId: getNotificationTemplateVariables
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Liste des variables

  /api/admin/notification-logs:
    get:
      tags:
        - Admin Notifications
      summary: Logs paginés des envois
      operationId: listNotificationLogs
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logs

  /api/admin/notification-logs/stats:
    get:
      tags:
        - Admin Notifications
      summary: Statistiques par statut et canal
      operationId: notificationStats
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Statistiques

  /api/admin/notification-logs/timeseries:
    get:
      tags:
        - Admin Notifications
      summary: Série quotidienne (total, envoyées, échouées, attente)
      operationId: notificationTimeseries
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            default: 14
      responses:
        '200':
          description: 1..90 points journaliers
  /api/admin/notification-logs/{id}/replay:
    post:
      tags:
        - Admin Notifications
      summary: Rejoue une notification (idempotent, respecte l'opt-out)
      operationId: replayNotification
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Notification rejouée

  /api/admin/notification-logs/seed-defaults:
    post:
      tags:
        - Admin Notifications
      summary: Installe providers et templates par défaut
      operationId: seedNotificationDefaults
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Défauts installés

  /api/admin/notification-logs/broadcast:
    post:
      tags:
        - Admin Notifications
      summary: Diffuse une annonce à tous les actifs (lots async)
      operationId: broadcastNotificationsToAll
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                title:
                  type: string
                message:
                  type: string
      responses:
        '202':
          description: Diffusion planifiée

  /api/admin/notification-routing:
    get:
      tags:
        - Admin Notifications
      summary: Routage événements → canaux (effectif)
      operationId: listNotificationRouting
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 11 événements avec canaux et kill-switch

  /api/admin/notification-routing/{key}:
    put:
      tags:
        - Admin Notifications
      summary: Crée/met à jour le routage d'un événement
      operationId: upsertNotificationRouting
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - channels
              properties:
                channels:
                  type: array
                  items:
                    type: string
                    enum: [in_app, push, sms, email]
                is_active:
                  type: boolean
      responses:
        '200':
          description: Règle enregistrée

  /api/admin/export/notifications:
    get:
      tags:
        - Admin Notifications
      summary: Export CSV des notifications (max 5000, filtres status/event_type)
      operationId: exportNotificationLogs
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: event_type
          schema:
            type: string
      responses:
        '200':
          description: Fichier CSV
  /api/webhooks/sms/{provider}:
    post:
      tags:
        - Webhooks
      summary: Accusé de réception SMS (DLR provider, toujours 200)
      operationId: smsDeliveryReceipt
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
            example: "orange_cm"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message_id:
                  type: string
                status:
                  type: string
                  example: "delivered"
      responses:
        '200':
          description: Accusé traité (même si ID inconnu)

  /api/webhooks/sms/{provider}/inbound:
    post:
      tags:
        - Webhooks
      summary: SMS entrant STOP/START (suppression immédiate, toujours 200)
      operationId: smsInbound
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                text:
                  type: string
      responses:
        '200':
          description: Traité (unsubscribed/resubscribed/ignored)

  /api/webhooks/ses:
    post:
      tags:
        - Webhooks
      summary: SES via SNS (bounce/plainte → suppression, signature vérifiée)
      operationId: sesFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Traité ou ignoré (toujours 200)
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token JWT obtenu via /api/auth/verify-otp"

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            code:
              type: string
            details:
              type: object

    User:
      type: object
      properties:
        id:
          type: integer
        phone:
          type: string
        name:
          type: string
        balance:
          type: integer
        is_active:
          type: boolean

    Transaction:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        type:
          type: string
          enum: [deposit, withdrawal, bet, winnings, commission, refund]
        amount:
          type: integer
          description: Montant en centimes (négatif pour débit)
        balance_before:
          type: integer
        balance_after:
          type: integer
        idempotency_key:
          type: string
        metadata:
          type: object
        inserted_at:
          type: string
          format: date-time

    Game:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        min_bet:
          type: integer
        max_bet:
          type: integer
        commission_rate:
          type: number
          format: float
        status:
          type: string
          enum: [active, inactive]
        players_online:
          type: integer

    GameDetail:
      allOf:
        - $ref: '#/components/schemas/Game'
        - type: object
          properties:
            commission_mode:
              type: string
              enum: [percentage, fixed, tiered]
            config:
              type: object

    GameState:
      type: object
      properties:
        game_id:
          type: string
        status:
          type: string
          enum: [waiting_for_bets, betting, in_progress, ended]
        players:
          type: array
          items:
            type: string
        game_type:
          type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
        has_next:
          type: boolean
        has_prev:
          type: boolean

    TokenSummary:
      type: object
      properties:
        token_balance:
          type: integer
          example: 5000
        monetary_value_centimes:
          type: integer
          example: 50000
        monetary_value_fcfa:
          type: number
          format: float
          example: 500.0
        exchange_rate:
          type: number
          format: float
          example: 1.0
        gift_enabled:
          type: boolean
          example: true

    TokenTransaction:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        type:
          type: string
          enum: [purchase, bet, winnings, gift_received, gift_sent, promo_credit, promo_debit, commission]
        token_amount:
          type: integer
        balance_before:
          type: integer
        balance_after:
          type: integer
        monetary_value:
          type: integer
          nullable: true
        exchange_rate:
          type: number
          nullable: true
        game_id:
          type: string
          nullable: true
        status:
          type: string
          default: completed
        inserted_at:
          type: string
          format: date-time

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        version:
          type: string
        environment:
          type: string
        checks:
          type: object
          properties:
            database:
              type: object
              properties:
                status:
                  type: string
                latency_ms:
                  type: integer
            redis:
              type: object
              properties:
                status:
                  type: string
                latency_ms:
                  type: integer
            timestamp:
              type: string
              format: date-time

    HealthDegradedResponse:
      allOf:
        - $ref: '#/components/schemas/HealthResponse'
        - type: object
          properties:
            status:
              enum: [degraded]

    HealthReadyResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ready]
        database:
          type: boolean
        redis:
          type: boolean

    HealthNotReadyResponse:
      type: object
      properties:
        status:
          type: string
          enum: [not_ready]
        database:
          type: boolean
        redis:
          type: boolean

    HealthDBResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        latency_ms:
          type: integer
        connections:
          type: integer

    HealthRedisResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        latency_ms:
          type: integer
        memory_used:
          type: integer
        connected_clients:
          type: integer
